# MyST configuration for the Al-Si-Fe intermetallic structure report.
version: 1
project:
  id: al-si-fe-structure
  title: Al-Si-Fe structure
  description: >
    Structure determination of an Al-Si-Fe intermetallic particle from
    multi-zone-axis atomic resolution STEM: the tau4 (delta) Al3FeSi2 phase
    with ferroelastic twin domains.
  keywords:
    - Al-Si alloys
    - intermetallics
    - tau4
    - delta-Al3FeSi2
    - HRSTEM
    - twinning
  github: https://github.com/ophusgroup/al-si-fe-structure
  exclude:
    - README.md
  abbreviations:
    STEM: scanning transmission electron microscopy
    HAADF: high-angle annular dark field
    EDS: energy dispersive X-ray spectroscopy
    FFT: fast Fourier transform
    APB: antiphase boundary
    DFT: density functional theory
    COD: Crystallography Open Database
  toc:
    - file: index.md
    - title: Structure
      children:
        - file: structure/model.md
        - file: structure/evidence.md
        - file: structure/literature.md
    - title: Mean unit cells
      children:
        - file: meanuc/index.md
        - file: meanuc/za1.md
        - file: meanuc/za2.md
        - file: meanuc/za3.md
        - file: meanuc/za4.md
        - file: meanuc/za5.md
        - file: meanuc/za7.md
        - file: meanuc/za8.md
        - file: meanuc/za9.md
    - title: Images
      children:
        - file: images/index.md
        - file: images/za1.md
        - file: images/za2.md
        - file: images/za3.md
        - file: images/za4.md
        - file: images/za5.md
        - file: images/za7.md
        - file: images/za8.md
        - file: images/za9.md
    - file: references.md
site:
  template: book-theme
  title: Al-Si-Fe structure
  parts:
    primary_sidebar_footer: parts/sidebar-footer.md
  options:
    style: ./style.css
    logo_text: Al-Si-Fe structure
    folders: true
    outline_maxdepth: 2
    hide_footer_links: true
  nav:
    - title: COLab
      url: https://colab.stanford.edu/
    - title: Stanford MSE
      url: https://mse.stanford.edu/
